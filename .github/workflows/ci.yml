name: CI

on: [push, pull_request]

jobs:
  backend-unit:
    # `verify` (not just `test`) so the JaCoCo line-coverage gate (>= 80% on
    # src/main) is enforced on every push in this Docker-free job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: mvn -B -q -f backend/pom.xml verify

  backend-mutation:
    # Mutation pilot (backlog #192): PIT over the auth token service and
    # the order state machine only (see backend/pom.xml `mutation`
    # profile + docs/mutation.md). The job fails below the profile's
    # mutationThreshold ratchet. The floor is 27 (backlog #212): the
    # measured mutation coverage on run 39735286602 (2026-10-22, head
    # 41c334d) is 81/291 = 27.8%, floored to a whole percent so an
    # identical rerun cannot fail on rounding — never above the
    # measured score (recorded in docs/mutation.md), never guessed.
    # PIT never runs in the default local `mvn -o test` path. The PIT
    # report is uploaded on every run so the measured score and the
    # surviving mutants are retrievable, not just pass/fail.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: mvn -B -f backend/pom.xml verify -Pmutation
      - name: Upload PIT mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pit-reports
          path: backend/target/pit-reports
          if-no-files-found: ignore

  backend-integration:
    # Testcontainers spins up a real MySQL 8; requires Docker (available on GH runners)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: mvn -B -f backend/pom.xml verify -Pintegration

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package.json
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      # Bundle-size budget (backlog #165): fail if the entry chunk or the
      # total JS outgrows the ratchet in frontend/scripts/check-bundle-size.mjs.
      - run: npm run size --prefix frontend
      # Frontend coverage gate (backlog #247): this runs the full suite
      # with coverage, and vitest fails the job when any metric falls
      # below the thresholds in frontend/vite.config.ts (measured floor
      # at head d6f294b, floored to whole percents — the #165 ratchet
      # discipline, mirroring the backend JaCoCo gate in backend-unit).
      # It replaces the plain `npm test` step: the coverage run executes
      # the same suite, so a separate uncovered run would only double
      # the job's test time.
      - run: npm run test:coverage --prefix frontend
      # CI-config check: fails if this job ever stops running the
      # coverage script or the config loses a metric threshold.
      - name: Check coverage gate wiring
        working-directory: frontend
        run: node scripts/check-coverage-gate.mjs

  frontend-mutation:
    # Frontend mutation pilot (backlog #252, widened by #263): Stryker
    # over the cart + auth stores (see frontend/stryker.config.mjs +
    # docs/mutation-frontend.md). The job fails below the config's
    # thresholds.break ratchet. The floor is the measured mutation
    # score of the pilot run, rounded DOWN to a whole percent so an
    # identical rerun cannot fail on rounding — never above the
    # measured score (recorded in docs/mutation-frontend.md), never
    # guessed. Stryker never runs in the default local `npm test` path.
    # The report is uploaded on every run so the measured score and
    # the surviving mutants are retrievable, not just pass/fail.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package.json
      - run: npm ci --prefix frontend
      # Gate-script tests first, including the job-definition check, so
      # the wiring proof runs even before mutants do. (Vitest, like the
      # other frontend/scripts tests — node:test files are not collected
      # by vitest and fail as empty suites.)
      - name: Run gate script tests (incl. job-definition check)
        working-directory: frontend
        run: npx vitest run scripts/check-mutation-gate.test.mjs
      - run: npm run test:mutation --prefix frontend
      - name: Upload Stryker mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stryker-reports
          path: frontend/reports/mutation
          if-no-files-found: ignore
      # CI-config check: fails if this job ever stops running the
      # mutation script or the config loses its break floor.
      - name: Check mutation gate wiring
        working-directory: frontend
        run: node scripts/check-mutation-gate.mjs

  api-drift:
    # API drift gate (backlog #205, shapes pinned by #258): the
    # frontend api modules are hand-written against the backend with
    # no codegen, so this job exports the OpenAPI document from the
    # backend contract-test path (the env-gated OpenApiExportTest
    # fetches /v3/api-docs exactly as OpenApiContractTest pins it)
    # and fails when any method+path the frontend calls is absent
    # from the document, or when a pinned request/response field on
    # the auth + orders surface disappears or changes type (pins in
    # frontend/scripts/api-shape-pins.mjs; register/login success
    # bodies stay unpinned — ResponseEntity<?> is untyped — see the
    # pins file header and backlog #271).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Export the OpenAPI document via the contract-test path
        env:
          OPENAPI_EXPORT_PATH: ${{ github.workspace }}/frontend/openapi.json
        run: mvn -B -f backend/pom.xml test -Dtest=com.toni.marketplace.common.OpenApiExportTest
      - run: npm ci --prefix frontend
      - run: npm run check:api --prefix frontend

  e2e:
    # Browser e2e smoke (backlog #181): Playwright drives real Chromium
    # against the built SPA (vite preview) + the real backend jar on its
    # default H2 profile — the layer the unit/build/compose-curl jobs
    # cannot prove (routing, SPA behaviour, the /api proxy shape). Eight
    # flows only (the #194 money path, the #213 offer/dispute paths, and
    # the #253 cart checkout journey included), retries 0: a flaky test is
    # fixed or deleted, never
    # retried into green. Browsers download here only; the repo's local
    # sandbox has no browsers, so this job is where the flows run.
    # The backend jar is packaged with tests skipped ON PURPOSE — the
    # backend-unit / backend-integration jobs gate those suites on the
    # same push; here the jar is only a fixture. Playwright's webServer
    # config (frontend/playwright.config.ts) starts the jar with the
    # email-verification gate stubbed off via its documented env knob
    # (the default mail sender is log-only, so no test could read a
    # verification link) and serves the built SPA on :4173.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package.json
      - run: mvn -B -q -f backend/pom.xml package -DskipTests
      - run: npm ci --prefix frontend
      - name: Install Chromium for Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run browser e2e smoke
        working-directory: frontend
        run: npm run e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore

  load-smoke:
    # Load smoke for the read hot paths (backlog #224): k6 drives the
    # browse list + item detail against the real backend jar on its
    # default H2 profile, in the e2e job's mould (the jar is packaged
    # with tests skipped ON PURPOSE — the backend-unit /
    # backend-integration jobs gate those suites on the same push; here
    # the jar is only a fixture). Measurement-only for performance:
    # the script carries NO thresholds (backlog #212 discipline — the
    # first CI run's p95/error-rate are recorded in docs/load-smoke.md
    # with the run id, and only then are thresholds set at or below the
    # measured floor, never guessed). The job DOES fail on failed
    # checks: a non-200 on a seeded read is a correctness defect, not a
    # performance variance. k6 is downloaded as a pinned release
    # tarball (no third-party action); the local sandbox cannot run k6
    # against the backend (TCP-blocked), so the script is inspect-checked
    # locally and proven here. The k6 summary is uploaded on every run
    # so the measured numbers are retrievable, not just pass/fail.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: mvn -B -q -f backend/pom.xml package -DskipTests
      - name: Install k6 (pinned release tarball)
        run: |
          curl -fsSL https://github.com/grafana/k6/releases/download/v2.3.0/k6-v2.3.0-linux-amd64.tar.gz | tar -xz
          echo "$PWD/k6-v2.3.0-linux-amd64" >> "$GITHUB_PATH"
      - name: Start the backend jar (H2, email-verification gate off)
        env:
          APP_AUTH_EMAIL_VERIFICATION_ENABLED: 'false'
        run: |
          nohup java -jar backend/target/campus-marketplace-0.1.0.jar > /tmp/backend-load-smoke.log 2>&1 &
          echo $! > /tmp/backend-load-smoke.pid
          code=""
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/actuator/health || true)
            if [ "$code" = "200" ]; then echo "backend is up"; break; fi
            echo "waiting for backend (got [$code])…"
            sleep 10
          done
          if [ "$code" != "200" ]; then echo "backend never came up"; cat /tmp/backend-load-smoke.log; exit 1; fi
      - name: Run the k6 read smoke
        run: k6 run --summary-export load/k6-summary.json load/k6-read-smoke.js
      - name: Fail on failed checks (correctness gate; performance thresholds unset)
        run: |
          python3 -c 'import json,sys; d=json.load(open("load/k6-summary.json")); f=d["metrics"]["checks"]["fails"]; print(f"checks failed: {f}"); sys.exit(1 if f else 0)'
      - name: Upload k6 summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-load-smoke-summary
          path: load/k6-summary.json
          if-no-files-found: ignore
      - name: Stop the backend jar
        if: always()
        run: kill "$(cat /tmp/backend-load-smoke.pid)" || true

  docker-compose-smoke:
    # Full-stack smoke on real MySQL 8: compose builds the backend + frontend
    # images, then register/login/create-listing are exercised through the
    # nginx /api proxy with the backend on the `mysql` Spring profile.
    # Manual version: docs/smoke-test.md
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d
      - name: Wait for the API through the nginx /api proxy
        run: |
          code=""
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost/api/items || true)
            # 401 (JSON envelope) means nginx → backend → security chain is live
            if [ "$code" = "401" ]; then echo "API is up"; break; fi
            echo "waiting for API (got [$code])…"
            sleep 10
          done
          if [ "$code" != "401" ]; then
            echo "API never came up through the proxy"
            docker compose logs backend
            exit 1
          fi
      - name: Actuator health is public and UP (liveness probe for the stack)
        run: |
          body=$(curl -fsS http://localhost:8080/actuator/health)
          echo "$body"
          echo "$body" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["status"]=="UP", d'
          echo "actuator /health is public and UP"
      - name: Register, login and create a listing through the proxy
        run: |
          curl -fsS -X POST http://localhost/api/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"username":"smoke","email":"smoke@example.com","password":"Sm0kePass123"}' \
            -o /tmp/register.json
          TOKEN=$(python3 -c 'import json; print(json.load(open("/tmp/register.json"))["data"]["accessToken"])')
          curl -fsS http://localhost/api/items -H "Authorization: Bearer $TOKEN" -o /dev/null
          curl -fsS -X POST http://localhost/api/items -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"title":"smoke listing","priceCents":1999}' -o /dev/null
          echo "smoke OK: register + list + create-listing all answered through the proxy"
      - name: Tear down
        if: always()
        run: docker compose down -v

  backup-restore-drill:
    # Backup + restore drill (backlog #225): seed the compose stack,
    # back it up with scripts/backup.sh, restore it into a scratch
    # project with scripts/restore-drill.sh (row counts must match),
    # then tear both stacks down. Manual version: docs/runbook.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d
      - name: Wait for the API through the nginx /api proxy
        run: |
          code=""
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost/api/items || true)
            # 401 (JSON envelope) means nginx → backend → security chain is live
            if [ "$code" = "401" ]; then echo "API is up"; break; fi
            echo "waiting for API (got [$code])…"
            sleep 10
          done
          if [ "$code" != "401" ]; then
            echo "API never came up through the proxy"
            docker compose logs backend
            exit 1
          fi
      - name: Seed the stack (one user, one listing) so the drill compares real rows
        run: |
          curl -fsS -X POST http://localhost/api/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"username":"smoke","email":"smoke@example.com","password":"Sm0kePass123"}' \
            -o /tmp/register.json
          TOKEN=$(curl -fsS -X POST http://localhost/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"usernameOrEmail":"smoke","password":"Sm0kePass123"}' \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["accessToken"])')
          curl -fsS -X POST http://localhost/api/items -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"title":"smoke listing","priceCents":1999}' -o /dev/null
          echo "seed OK: one user, one listing"
      - name: Back up the running stack
        run: bash scripts/backup.sh backups/ci-drill
      - name: Restore drill into a scratch project
        run: bash scripts/restore-drill.sh backups/ci-drill
      - name: Tear down
        if: always()
        run: |
          docker compose -p marketplace-restore-drill down -v || true
          docker compose down -v

  dependency-vuln-gate:
    # Dependency vulnerability gate (backlog #248): a dedicated job, not a
    # step buried in another job, so a vulnerable dependency fails the
    # workflow on its own. Dependabot (#231) opens update PRs, but nothing
    # before this job failed a build on a vulnerability already in the tree.
    # Thresholds: npm severity high-or-above; Maven CVSS >= 7.0 (see
    # scripts/check-vuln-gate.mjs). Reviewed false positives live in
    # frontend/vuln-suppressions.json and backend/vuln-suppressions.json
    # (package + advisory + reason + reviewed date; the gate refuses
    # entries missing any field) — the #165 ratchet discipline, not
    # silent ignores. Full rationale and measured baselines:
    # docs/dependency-vuln-gate.md.
    # Sandbox honesty note: the frontend `npm audit` call below runs for
    # real here in CI; the local sandbox proxy denies the audit endpoint
    # (403 policy_denied), so local proof for the npm side is the OSV
    # cross-check recorded in docs/dependency-vuln-gate.md, and the
    # backend OSV scan runs identically in both places.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # Gate script's own tests first, including the job-definition check
      # that reads this file: a later edit that drops a step below fails
      # here instead of silently narrowing the gate.
      - name: Run gate script tests (incl. job-definition check)
        run: node --test scripts/check-vuln-gate.test.mjs
      # Frontend: npm audit is the scanner; the gate script is the decider
      # so reviewed suppressions are honoured. `|| true` on audit itself:
      # audit exits non-zero when it finds anything, and the script must
      # see the full report to decide (a malformed report fails closed).
      # No `npm ci` needed: audit reads package-lock.json only.
      - name: Frontend npm audit report
        working-directory: frontend
        run: npm audit --json > npm-audit.json || true
      - name: Frontend vulnerability gate (high-or-above, suppressions applied)
        working-directory: frontend
        run: node ../scripts/check-vuln-gate.mjs --npm-audit npm-audit.json --npm-suppressions vuln-suppressions.json
      # Backend: dependency tree + OSV scan (no key, no NVD feed download).
      # The tree step runs online here; locally the same command runs with
      # -o and the persistent Maven repo (see docs/dependency-vuln-gate.md).
      - name: Backend dependency tree
        run: mvn -B -f backend/pom.xml dependency:tree -DoutputFile="${{ github.workspace }}/backend/maven-tree.txt"
      - name: Backend vulnerability gate (CVSS >= 7.0, suppressions applied)
        run: node scripts/check-vuln-gate.mjs --maven-tree backend/maven-tree.txt --maven-suppressions backend/vuln-suppressions.json
