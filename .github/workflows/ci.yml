name: CI

on: [push, pull_request]

jobs:
  backend-unit:
    # `verify` (not just `test`) so the JaCoCo line-coverage gate (>= 80% on
    # src/main) is enforced on every push in this Docker-free job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: mvn -B -q -f backend/pom.xml verify

  backend-mutation:
    # Mutation pilot (backlog #192): PIT over the auth token service and
    # the order state machine only (see backend/pom.xml `mutation`
    # profile + docs/mutation.md). The job fails below the profile's
    # mutationThreshold ratchet. The threshold starts at 0 for the first
    # run on purpose: the floor is set from that first real run's
    # measured score (recorded in docs/mutation.md), never guessed.
    # PIT never runs in the default local `mvn -o test` path. The PIT
    # report is uploaded on every run so the measured score and the
    # surviving mutants are retrievable, not just pass/fail.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: mvn -B -f backend/pom.xml verify -Pmutation
      - name: Upload PIT mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pit-reports
          path: backend/target/pit-reports
          if-no-files-found: ignore

  backend-integration:
    # Testcontainers spins up a real MySQL 8; requires Docker (available on GH runners)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: mvn -B -f backend/pom.xml verify -Pintegration

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package.json
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      # Bundle-size budget (backlog #165): fail if the entry chunk or the
      # total JS outgrows the ratchet in frontend/scripts/check-bundle-size.mjs.
      - run: npm run size --prefix frontend
      - run: npm test --prefix frontend -- --run --passWithNoTests

  api-drift:
    # API drift gate (backlog #205): the frontend api modules are
    # hand-written against the backend with no codegen, so this job
    # exports the OpenAPI document from the backend contract-test path
    # (the env-gated OpenApiExportTest fetches /v3/api-docs exactly as
    # OpenApiContractTest pins it) and fails when any method+path the
    # frontend calls is absent from the document. Paths + methods only
    # — payload shapes are not pinned (see the script header).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Export the OpenAPI document via the contract-test path
        env:
          OPENAPI_EXPORT_PATH: ${{ github.workspace }}/frontend/openapi.json
        run: mvn -B -f backend/pom.xml test -Dtest=com.toni.marketplace.common.OpenApiExportTest
      - run: npm ci --prefix frontend
      - run: npm run check:api --prefix frontend

  e2e:
    # Browser e2e smoke (backlog #181): Playwright drives real Chromium
    # against the built SPA (vite preview) + the real backend jar on its
    # default H2 profile — the layer the unit/build/compose-curl jobs
    # cannot prove (routing, SPA behaviour, the /api proxy shape). Five
    # flows only (the #194 money path included), retries 0: a flaky test is fixed or deleted, never
    # retried into green. Browsers download here only; the repo's local
    # sandbox has no browsers, so this job is where the flows run.
    # The backend jar is packaged with tests skipped ON PURPOSE — the
    # backend-unit / backend-integration jobs gate those suites on the
    # same push; here the jar is only a fixture. Playwright's webServer
    # config (frontend/playwright.config.ts) starts the jar with the
    # email-verification gate stubbed off via its documented env knob
    # (the default mail sender is log-only, so no test could read a
    # verification link) and serves the built SPA on :4173.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package.json
      - run: mvn -B -q -f backend/pom.xml package -DskipTests
      - run: npm ci --prefix frontend
      - name: Install Chromium for Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run browser e2e smoke
        working-directory: frontend
        run: npm run e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore

  docker-compose-smoke:
    # Full-stack smoke on real MySQL 8: compose builds the backend + frontend
    # images, then register/login/create-listing are exercised through the
    # nginx /api proxy with the backend on the `mysql` Spring profile.
    # Manual version: docs/smoke-test.md
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d
      - name: Wait for the API through the nginx /api proxy
        run: |
          code=""
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost/api/items || true)
            # 401 (JSON envelope) means nginx → backend → security chain is live
            if [ "$code" = "401" ]; then echo "API is up"; break; fi
            echo "waiting for API (got [$code])…"
            sleep 10
          done
          if [ "$code" != "401" ]; then
            echo "API never came up through the proxy"
            docker compose logs backend
            exit 1
          fi
      - name: Actuator health is public and UP (liveness probe for the stack)
        run: |
          body=$(curl -fsS http://localhost:8080/actuator/health)
          echo "$body"
          echo "$body" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["status"]=="UP", d'
          echo "actuator /health is public and UP"
      - name: Register, login and create a listing through the proxy
        run: |
          curl -fsS -X POST http://localhost/api/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"username":"smoke","email":"smoke@example.com","password":"Sm0kePass123"}' \
            -o /tmp/register.json
          TOKEN=$(python3 -c 'import json; print(json.load(open("/tmp/register.json"))["data"]["accessToken"])')
          curl -fsS http://localhost/api/items -H "Authorization: Bearer $TOKEN" -o /dev/null
          curl -fsS -X POST http://localhost/api/items -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"title":"smoke listing","priceCents":1999}' -o /dev/null
          echo "smoke OK: register + list + create-listing all answered through the proxy"
      - name: Tear down
        if: always()
        run: docker compose down -v
