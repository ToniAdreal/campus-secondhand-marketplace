services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: marketdb
      MYSQL_USER: market
      MYSQL_PASSWORD: market
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    # MySQL 8 takes ~10-20s to initialize on first boot; without this the
    # backend starts against a closed port, fails datasource init, and exits.
    # Backend waits for the healthy condition below before starting.
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      # The backend refuses to boot on the mysql profile with the committed
      # dev placeholder (JwtSecretStartupCheck). Compose fails early with this
      # message if the operator forgets to export APP_JWT_SECRET first —
      # generate one with: export APP_JWT_SECRET=$(openssl rand -base64 32)
      APP_JWT_SECRET: ${APP_JWT_SECRET:?APP_JWT_SECRET is required — export it before 'docker compose up' (see docs/smoke-test.md)}
      # Same fail-fast pattern for the TOTP secret encryption key
      # (TotpEncryptionKeyStartupCheck, backlog #89): the backend refuses
      # to boot on the mysql profile with the committed dev placeholder —
      # generate one with: export APP_TOTP_ENCRYPTION_KEY=$(openssl rand -base64 32)
      APP_TOTP_ENCRYPTION_KEY: ${APP_TOTP_ENCRYPTION_KEY:?APP_TOTP_ENCRYPTION_KEY is required — export it before 'docker compose up' (see docs/smoke-test.md)}
      # Listing photos are served from app.uploads.dir; pin it to the
      # uploads-data volume mount below so the path does not depend on the
      # image's WORKDIR (./uploads would resolve to /app/uploads anyway).
      APP_UPLOADS_DIR: /app/uploads
    volumes:
      # Named volume: uploaded listing photos survive a backend container
      # recreate / `docker compose down` (they used to live in the
      # container's writable layer and die with it). `docker compose down -v`
      # still drops it together with mysql-data — see docs/smoke-test.md.
      - uploads-data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql-data:
  uploads-data:
