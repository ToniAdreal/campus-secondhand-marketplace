services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: marketdb
      MYSQL_USER: market
      MYSQL_PASSWORD: market
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    # MySQL 8 takes ~10-20s to initialize on first boot; without this the
    # backend starts against a closed port, fails datasource init, and exits.
    # Backend waits for the healthy condition below before starting.
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  backend:
    build: ./backend
    # Graceful shutdown (backlog #136): `docker compose down` sends
    # SIGTERM and the backend drains in-flight HTTP requests for up to
    # 30 s (server.shutdown=graceful + spring.lifecycle timeout in
    # application.yml). Give the container 40 s — just above that drain
    # window — before Docker escalates to SIGKILL.
    stop_grace_period: 40s
    ports:
      - "8080:8080"
    environment:
      # Profiles are overridable from the shell so the opt-in structured
      # JSON logging profile (backlog #137, logback-spring.xml) can be
      # layered onto the mysql profile without editing this file:
      #   SPRING_PROFILES_ACTIVE=mysql,json-logs docker compose up
      # The default stays exactly `mysql` (plain-text console logs).
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-mysql}
      # The backend refuses to boot on the mysql profile with the committed
      # dev placeholder (JwtSecretStartupCheck). Compose fails early with this
      # message if the operator forgets to export APP_JWT_SECRET first —
      # generate one with: export APP_JWT_SECRET=$(openssl rand -base64 32)
      APP_JWT_SECRET: ${APP_JWT_SECRET:?APP_JWT_SECRET is required — export it before 'docker compose up' (see docs/smoke-test.md)}
      # Same fail-fast pattern for the TOTP secret encryption key
      # (TotpEncryptionKeyStartupCheck, backlog #89): the backend refuses
      # to boot on the mysql profile with the committed dev placeholder —
      # generate one with: export APP_TOTP_ENCRYPTION_KEY=$(openssl rand -base64 32)
      APP_TOTP_ENCRYPTION_KEY: ${APP_TOTP_ENCRYPTION_KEY:?APP_TOTP_ENCRYPTION_KEY is required — export it before 'docker compose up' (see docs/smoke-test.md)}
      # Mock-PSP webhook secret (backlog #366): the backend refuses to
      # boot on the mysql profile with the committed dev placeholder
      # (WebhookSecretStartupCheck) — the compose stack must be handed a
      # random secret, and the smoke signs its deliveries with that same
      # value. Generate one with:
      #   export APP_PAYMENTS_WEBHOOK_SECRET=$(openssl rand -hex 32)
      APP_PAYMENTS_WEBHOOK_SECRET: ${APP_PAYMENTS_WEBHOOK_SECRET:?APP_PAYMENTS_WEBHOOK_SECRET is required — export it before 'docker compose up' (see docs/smoke-test.md)}
      # First-admin bootstrap (backlog #366, #213): forwarded so the CI
      # smoke can log in as ADMIN and read the webhook-event ledger.
      # All three must be set together or all unset — the initializer is
      # a strict no-op when unset and fails fast on a partial set. A
      # plain `docker compose up` sets none of them, so no admin is
      # seeded unless the operator asks for one.
      APP_BOOTSTRAP_ADMIN_USERNAME: ${APP_BOOTSTRAP_ADMIN_USERNAME:-}
      APP_BOOTSTRAP_ADMIN_EMAIL: ${APP_BOOTSTRAP_ADMIN_EMAIL:-}
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${APP_BOOTSTRAP_ADMIN_PASSWORD:-}
      # Listing photos are served from app.uploads.dir; pin it to the
      # uploads-data volume mount below so the path does not depend on the
      # image's WORKDIR (./uploads would resolve to /app/uploads anyway).
      APP_UPLOADS_DIR: /app/uploads
      # Email-verification gate (backlog #325): forwarded, never silenced —
      # the default stays ON (application.yml default true), so a plain
      # `docker compose up` still runs the production gate. The CI smoke
      # and backup-restore-drill jobs export 'false' for this variable so
      # their register-then-token curls work, the same documented knob
      # the e2e/k6 jobs already use for the jar (no mailbox exists in
      # CI, and the default sender logs the token redacted, so no CI
      # job could complete a confirm-then-login flow with the gate on).
      APP_AUTH_EMAIL_VERIFICATION_ENABLED: ${APP_AUTH_EMAIL_VERIFICATION_ENABLED:-true}
      # Refresh-cookie Secure flag (backlog #130, #385): this stack serves
      # plain HTTP on localhost only (nginx :80, no TLS anywhere), so a
      # Secure cookie could never be stored by a browser here — and the
      # backend refuses to boot on the mysql profile with
      # cookie-secure=false unless the operator sets the explicit
      # local-only opt-out (RefreshCookieSecureStartupCheck). That check
      # killed both CI compose jobs (docker-compose-smoke and
      # backup-restore-drill) at boot, so the opt-out is defaulted to
      # true IN THIS FILE ONLY: the compose stack is a local dev/smoke
      # stack, never a deployment. An HTTPS deployment must set
      # APP_AUTH_COOKIE_SECURE=true and leave this false instead — never
      # copy this file to production as-is.
      APP_AUTH_ALLOW_INSECURE_COOKIE: ${APP_AUTH_ALLOW_INSECURE_COOKIE:-true}
      # Content-Security-Policy on the API + /uploads/** (backlog #429):
      # the backend's opt-in strict policy (SecurityConfig, backlog #80)
      # is off by default, so a plain jar serves no CSP at all. This stack
      # turns it on so the deployed stack sends the same strict policy the
      # nginx layer already sends on the SPA + /api/ (frontend/nginx.conf,
      # backlog #363). Local dev (Vite) keeps the flag off — the dev
      # server serves the SPA itself.
      APP_SECURITY_HEADERS_CSP_ENABLED: "true"
    volumes:
      # Named volume: uploaded listing photos survive a backend container
      # recreate / `docker compose down` (they used to live in the
      # container's writable layer and die with it). `docker compose down -v`
      # still drops it together with mysql-data — see docs/smoke-test.md.
      - uploads-data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql-data:
  uploads-data:
