# Prometheus config for the opt-in `observability` compose profile
# (backlog #430). Scrape target: the backend's /actuator/prometheus,
# which needs a Bearer token (SecurityConfig — any authenticated user;
# health/info are the only public actuator endpoints). The credential
# is NOT a static token in this file: the metrics-token-refresher
# service logs in as the bootstrap ADMIN, refreshes the 15-minute
# access token every 10 minutes, and writes it to the shared
# metrics-token volume; bearer_token_file is re-read on every scrape,
# so rotation needs no Prometheus reload. Never point this at an
# anonymous scrape — the endpoint answers 401 without a token and the
# target shows down, which is the smoke test's assertion.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: campus-marketplace-backend
    metrics_path: /actuator/prometheus
    bearer_token_file: /etc/prometheus/token/access-token
    static_configs:
      - targets: ['backend:8080']
