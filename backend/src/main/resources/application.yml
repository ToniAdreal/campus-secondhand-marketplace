server:
  # Graceful shutdown (backlog #136): on SIGTERM the embedded web server
  # stops accepting new requests and drains in-flight ones instead of the
  # JVM exiting abruptly mid-request (a pay or upload cut in half).
  # The drain window is spring.lifecycle.timeout-per-shutdown-phase
  # below; docker-compose gives the container stop_grace_period 40 s —
  # just above that window — before SIGKILL. Honest scope: this drains
  # HTTP requests only; the @Scheduled sweeps (#35/#51) are not
  # transactional with shutdown and stay idempotent/batch-tolerant.
  shutdown: graceful

springdoc:
  # OpenAPI contract (backlog #95): /v3/api-docs (JSON) + /swagger-ui.html.
  # Both are behind Bearer authentication in SecurityConfig — the route map
  # is not public information for this demo's threat model.
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

spring:
  lifecycle:
    # Per-phase shutdown timeout for graceful shutdown (backlog #136,
    # server.shutdown above): in-flight HTTP requests get up to 30 s to
    # finish before the phase is forced on. Kept below the compose
    # backend service's stop_grace_period (40 s) so the drain can
    # complete before Docker escalates to SIGKILL.
    timeout-per-shutdown-phase: 30s
  datasource:
    # Local dev default: in-memory H2 (MySQL compatibility mode), migrated by Flyway.
    # Real MySQL path: docker compose up (uses the `mysql` profile below).
    url: jdbc:h2:mem:marketdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: true
    # `{vendor}` is replaced by Spring Boot with the JDBC database product
    # id (mysql / h2). Vendor-specific migrations live under db/vendor/<id>/
    # as a SIBLING of db/migration/ — never nested inside it, because Flyway
    # scans locations recursively and would otherwise apply them on every
    # database. A missing vendor directory is skipped with a warning.
    locations: classpath:db/migration,classpath:db/vendor/{vendor}
  servlet:
    multipart:
      # Backstop for upload size; the primary check is in ImageStorageService
      # (app.uploads.max-size), which throws InvalidImageException → 400.
      max-file-size: 5MB
      max-request-size: 5MB
  data:
    web:
      pageable:
        # Cap requested page sizes on every Pageable-backed list endpoint
        # (backlog #75): GET /api/items, /api/orders and /api/seller/orders
        # all bind ?page=&size= through Spring Data's pageable resolver, so
        # ?size=10000 now clamps to this value instead of running an
        # unbounded row scan. @PageableDefault only sets the default — it
        # never capped the maximum. The message thread (#41) is unaffected:
        # it parses size itself (plain @RequestParam) and enforces its own
        # cap of 50 in MessageService.
        max-page-size: 100
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.format_sql: true

app:
  cors:
    # Explicit CORS allowlist (SecurityConfig, backlog #63). Before #63 there
    # was no CORS configuration at all. Defaults: Vite dev (5173) + the
    # docker-compose nginx origin (http://localhost — same origin as the
    # proxied API in practice). Production must override with the real SPA
    # origin, e.g. app.cors.allowed-origins=https://app.example.com.
    # allowed-origins: http://localhost:5173,http://localhost
  security:
    # Trusted reverse proxies for rate-limit client-IP resolution
    # (AuthRateLimitFilter, backlog #104): X-Forwarded-For is honored ONLY
    # when the immediate remote address is listed here (exact match, no
    # CIDR/wildcards), taking the first untrusted hop of the chain. Empty
    # by default = the header is always ignored and identity is the raw
    # remote address. A deployment behind the docker-compose nginx proxy
    # lists that proxy's address here, e.g.
    # app.security.trusted-proxies=172.18.0.5 — never list an address an
    # end user can connect from directly, or they can spoof their bucket
    # key.
    # trusted-proxies:
    headers:
      # Security response headers (SecurityConfig, backlog #64). Every
      # response carries X-Content-Type-Options: nosniff, X-Frame-Options:
      # DENY and Referrer-Policy: no-referrer. HSTS
      # (Strict-Transport-Security) is opt-in: leave OFF for local
      # plain-HTTP dev, turn ON (app.security.headers.hsts-enabled=true)
      # on any HTTPS-served deployment. Content-Security-Policy
      # (backlog #80) is opt-in the same way: OFF by default, turn ON
      # (app.security.headers.csp-enabled=true) on deployments serving
      # the built SPA — the policy is 'self'-only with no
      # 'unsafe-inline' (verified against the Vite build output).
      # hsts-enabled: false
      # csp-enabled: false
  uploads:
    # Local directory for listing photos (served publicly under /uploads/**).
    # Override with the APP_UPLOADS_DIR environment variable in production.
    dir: ${APP_UPLOADS_DIR:./uploads}
    max-size: 5MB
    # Grace period for the nightly orphan-upload sweep (OrphanUploadSweeper,
    # backlog #103): a file unreferenced by any item/photo row is deleted
    # only once its mtime is older than this, so a just-written pre-commit
    # file (stored before its transaction commits) is never swept.
    orphan-grace: 24h
    # Free-space floor for the upload-storage health indicator
    # (UploadStorageHealthIndicator, backlog #154): readiness reports
    # DOWN when the upload directory's file store has less usable space
    # than this, so a full disk stops traffic before uploads start
    # failing user-visibly. Readiness only — never liveness.
    health-min-free: 10MB
  auth:
    # Refresh-cookie Secure flag (AuthController, backlog #130): the
    # httpOnly refresh_token cookie is a 7-day credential, so behind
    # HTTPS it must carry the Secure attribute; local plain-HTTP dev
    # cannot store a Secure cookie at all, so the flag defaults to
    # false here. On the `mysql` profile the app REFUSES to boot with
    # it still false — RefreshCookieSecureStartupCheck fails fast —
    # unless the operator sets the explicit local-only opt-out
    # allow-insecure-cookie=true (APP_AUTH_ALLOW_INSECURE_COOKIE=true).
    # The set cookie and the logout clear-cookie always share this flag
    # (they must agree or the browser will not overwrite the cookie).
    cookie-secure: ${APP_AUTH_COOKIE_SECURE:false}
    allow-insecure-cookie: ${APP_AUTH_ALLOW_INSECURE_COOKIE:false}
    # Minimum password length (PasswordStrengthValidator, backlog #131):
    # every credential-setting path (register, password change, reset
    # confirm) shares the one validator, so this single knob governs all
    # of them. Existing accounts are untouched until their next
    # change/reset — no forced migration.
    password-min-length: ${APP_AUTH_PASSWORD_MIN_LENGTH:12}
    # Password history (PasswordHistoryService, backlog #139): every
    # successful password change AND reset confirm appends the outgoing
    # BCrypt hash to the password_history table (Flyway V27), and a new
    # password matching the current hash or any of the last this-many
    # outgoing hashes is rejected 400 through ONE check shared by both
    # paths — A→B→A cycling no longer works, and the reset path (which
    # previously had no reuse guard at all) enforces identically. The
    # window slides: the sixth-oldest password is allowed again.
    password-history-size: ${APP_AUTH_PASSWORD_HISTORY_SIZE:5}
    email-verification:
      # Email verification for new accounts (EmailVerificationService,
      # backlog #138): while enabled (the default), registration creates
      # the account unverified and issues NO session; a single-use token
      # (32 random bytes, only its SHA-256 hash stored, Flyway V26) is
      # delivered through the EmailVerificationMailSender seam (honest
      # scope: no mail server exists in this project, so the default
      # sender logs the request at INFO with the token redacted and
      # delivers nothing; a real deployment injects an SMTP/SES sender).
      # POST /api/auth/email-verification/confirm {token} flips the flag;
      # login of an unverified account answers 403 (the credentials may be
      # right — it is not a 401). Accounts that predate V26 migrate
      # verified=true: the gate applies to new signups only. Both public
      # endpoints share their own 5/min-per-IP rate-limit bucket
      # (AuthRateLimitFilter). The token lifetime is a day, not the reset
      # flow's 30 min: a verification link goes to a mailbox the new user
      # may only check hours later, and confirming it grants no session
      # by itself.
      enabled: ${APP_AUTH_EMAIL_VERIFICATION_ENABLED:true}
      token-ttl: 24h
    password-reset:
      # Password-reset token lifetime (PasswordResetService, backlog #90):
      # a reset token is a bearer credential for a full password change, so
      # it is single-use and short-lived (30 min) — nothing like the 7 d
      # refresh token. Tokens are 32 random bytes; only the SHA-256 hash is
      # stored (V20), and the raw token leaves the server only through the
      # PasswordResetMailSender seam (the default bean logs, token redacted,
      # and delivers nothing — this project has no mail server). Both reset
      # endpoints are rate-limited per IP (5/min, own bucket in
      # AuthRateLimitFilter).
      token-ttl: 30m
    totp:
      # TOTP secret encryption at rest (TotpSecretCipher, backlog #89):
      # Base64-encoded 256-bit AES key encrypting the TOTP shared secret
      # before it is stored on app_user (v1:<iv>:<ciphertext> form).
      # Dev-only placeholder for local H2 runs. On the `mysql` profile the
      # app REFUSES to boot with this placeholder —
      # TotpEncryptionKeyStartupCheck fails fast unless the
      # APP_TOTP_ENCRYPTION_KEY environment variable is set. Rotating the
      # key makes previously stored secrets undecryptable (users
      # re-enroll in 2FA) — there is no key-version fallback by design.
      encryption-key: ${APP_TOTP_ENCRYPTION_KEY:dPMyJmneAVMf3iVLfGxDnvt3/UU9XI6hjfNNpracjOM=}
    login-lockout:
      # Per-account login lockout (AuthService, backlog #60): the per-IP token
      # bucket stops single-source hammering, but not a distributed slow
      # brute-force against one account. After max-attempts consecutive
      # failures the account locks for lock-duration and POST /api/auth/login
      # answers 423 with a Retry-After header; a successful login resets the
      # counter. Applies to existing accounts only — unknown identifiers keep
      # getting the identical 401 (no enumeration oracle).
      max-attempts: 5
      lock-duration: 15m
    totp-lockout:
      # Per-account second-factor lockout (AuthService.authenticateTotp,
      # backlog #101): the /api/auth/2fa/authenticate exchange has its own
      # 5/min-per-IP rate-limit bucket, and after max-attempts consecutive
      # failed exchanges the EXCHANGE locks for lock-duration (423 +
      # Retry-After, even for a correct code under a fresh challenge); a
      # successful exchange resets the counter. Deliberately separate from
      # the login lockout above (own columns, Flyway V23): while
      # TOTP-locked, password login still verifies and issues challenges —
      # a challenge holder cannot lock the owner out of login entirely.
      max-attempts: 5
      lock-duration: 15m
  cleanup:
    # Nightly purge of stale auth/order bookkeeping rows
    # (DataRetentionService, @Scheduled 03:00 server-local). Values in days.
    # refresh-token-retention: revoked-or-expired refresh_token rows kept
    #   after creation (audit + rotation-chain visibility), default 30.
    # idempotency-retention: terminal (COMPLETED/FAILED) idempotency_key rows
    #   kept after their last state transition, default 90. IN_PROGRESS rows
    #   are never purged.
    # password-reset-retention: used-or-expired password_reset_token rows
    #   kept after creation (brief security-audit evidence), default 30.
    #   Still-valid unused tokens are never purged.
    # audit-log-retention: audit_log rows kept after creation, default 365
    #   (backlog #118) — the trail is the security record, so its window is
    #   materially longer than the token windows. Deletion is by created_at
    #   only (never by action/actor); the trail is append-only within the
    #   window, and operators export before purge for longer evidence.
    # webhook-event-retention: webhook_event rows kept after creation,
    #   default 180 (backlog #152) — delivery evidence for PSP
    #   reconciliation. Deletion is by created_at only (never by outcome).
    # email-verification-token-retention: used-or-expired
    #   email_verification_token rows kept after creation, default 30
    #   (backlog #152, aligned with password-reset-retention).
    #   Still-valid unused tokens are never purged.
    refresh-token-retention: 30
    idempotency-retention: 90
    password-reset-retention: 30
    audit-log-retention: 365
    webhook-event-retention: 180
    email-verification-token-retention: 30
  orders:
    # Pending-order expiry (PendingOrderExpiryService, @Scheduled every 5
    # minutes server-local). A buyer who creates an order and never pays
    # strands the listing in RESERVED until they cancel manually (#33);
    # PENDING orders older than this TTL are cancelled automatically and the
    # listing flips back to AVAILABLE. Default 30 minutes; expiry granularity
    # is the 5-minute cadence, so a stale order holds its listing at most
    # TTL + one cadence.
    pending-ttl: 30m
  offers:
    # Pending-offer expiry (OfferExpiryService, @Scheduled every 5
    # minutes server-local; decision endpoints also check the deadline
    # lazily). A buyer who proposes a price and is never answered holds
    # nothing hostage — an unanswered offer reserves no listing — so
    # this TTL is a response window for the seller, not a release
    # valve: PENDING offers older than this flip to EXPIRED and the
    # (buyer, item) live pair frees up for a fresh offer. Default 48
    # hours; expiry granularity is the 5-minute cadence.
    pending-ttl: 48h
  payments:
    # Mock-PSP webhook receiver (PaymentWebhookService, backlog #140):
    # POST /api/payments/webhooks/mock-psp is a public route authenticated
    # by a timestamped HMAC-SHA256 signature header (X-Mock-Psp-Signature,
    # Stripe-style t=<unix seconds>,v1=<hmac over "<t>.<raw body>"> since
    # backlog #149; freshness window in app.webhooks below) instead of a
    # Bearer token. This committed value is a
    # dev-only placeholder for local H2 runs; on the `mysql` profile the
    # app REFUSES to boot with it — WebhookSecretStartupCheck fails fast
    # unless APP_PAYMENTS_WEBHOOK_SECRET is set to a random secret shared
    # only with the PSP. Deliveries are idempotent on the PSP event id
    # (Flyway V28) and never move money state by themselves: they only
    # reconcile against orders already carrying the capture/refund id.
    webhook-secret: ${APP_PAYMENTS_WEBHOOK_SECRET:dev-only-webhook-secret-change-me}
  webhooks:
    # Webhook signature freshness window (PaymentWebhookService, backlog
    # #149): deliveries carry a Stripe-style header
    # (X-Mock-Psp-Signature: t=<unix seconds>,v1=<HMAC-SHA256 over
    # "<t>.<raw body>">). A timestamp more than this far from the server
    # clock — stale or far-future — answers the same 401 as a bad
    # signature, so a captured delivery expires instead of staying
    # replayable until the event-id ledger happens to dedupe it. The
    # pre-#149 bare-hex body-only format is NOT accepted (no dual-format
    # grace; the mock PSP is this repo's own sender).
    signature-tolerance: 5m
  jwt:
    # Base64 HS256 key (256 bits). Dev-only placeholder for local H2 runs.
    # On the `mysql` profile (the docker-compose path) the app REFUSES to boot
    # with this placeholder — JwtSecretStartupCheck fails fast unless the
    # APP_JWT_SECRET environment variable is set. Access 15 min / refresh 7 days.
    secret: ${APP_JWT_SECRET:74xcpYqCpoJStMnkqprFiMYwsQIZD/zPa3LgyU83nbE=}
    # Signing-key rotation (JwtTokenService, backlog #113): every token is
    # signed with the current key only and stamped with this key id in its
    # `kid` header. While rotating, set APP_JWT_PREVIOUS_SECRET to the
    # outgoing key (Base64, same format as APP_JWT_SECRET) and
    # APP_JWT_PREVIOUS_ACCEPT_UNTIL to the end of the rotation window
    # (ISO-8601 instant, sized to outlive the 7 d refresh TTL, e.g.
    # 2026-10-17T00:00:00Z): tokens carrying the previous kid verify ONLY
    # until that instant and the previous key never signs. A previous
    # secret without a deadline is never accepted (fail-closed), and on
    # the `mysql` profile the previous secret is refused when it equals
    # the committed dev placeholder (JwtSecretStartupCheck). Leave the
    # previous-secret unset when not rotating.
    current-kid: ${APP_JWT_CURRENT_KID:current}
    previous-secret: ${APP_JWT_PREVIOUS_SECRET:}
    previous-kid: ${APP_JWT_PREVIOUS_KID:previous}
    previous-accept-until: ${APP_JWT_PREVIOUS_ACCEPT_UNTIL:}
    access-ttl: 15m
    refresh-ttl: 7d
    # How long a just-rotated refresh token is still accepted once more
    # (concurrent-tab grace, backlog #39). Replays after the window kill
    # the token family (theft detection).
    refresh-grace-window: 60s
    # Absolute lifetime of a refresh-token family (backlog #61), measured
    # from the original login. A refresh past this point returns 401 and
    # revokes the family — even when the presented token is unexpired —
    # forcing a fresh login; rotation alone can no longer keep a session
    # alive forever.
    refresh-max-age: 30d
    # Lifetime of the signed 2FA challenge returned by POST /api/auth/login
    # (HTTP 202) for TOTP-enabled accounts (backlog #78). The challenge is
    # exchanged — with a valid 6-digit code — at
    # POST /api/auth/2fa/authenticate for the real token pair. Stateless:
    # replay inside the window is harmless because every use still requires
    # a fresh valid TOTP code.
    totp-challenge-ttl: 5m

# Logging is configured in logback-spring.xml (backlog #137): the default
# console pattern lives there (it renders %X{requestId}, the MDC value set
# by RequestIdFilter — backlog #44; empty when nothing is in the MDC), and
# the opt-in `json-logs` Spring profile swaps the console encoder to
# logstash-logback-encoder JSON (one object per line, requestId included).
# There is deliberately no `logging.pattern.console` here anymore — with a
# logback-spring.xml present, Boot would ignore it and the two would drift.

management:
  endpoint:
    health:
      # Liveness / readiness probe groups (backlog #128): an orchestrator
      # polls the two groups separately. Liveness is livenessState ONLY —
      # never the database: a DB outage must fail readiness (stop routing
      # traffic) without restart-looping the app. Readiness is
      # readinessState + db + uploadStorage (backlog #154 — the upload
      # directory is a readiness concern on the same terms: a full or
      # unwritable disk stops routing, never restarts). Probes are enabled explicitly so the groups
      # exist outside Kubernetes too (Boot otherwise only auto-creates
      # them on k8s). show-details stays at its default (never): the group
      # endpoints disclose only UP/DOWN component status.
      probes:
        enabled: true
      # Component NAMES + their UP/DOWN status are shown even though
      # show-details stays never: Boot's separate show-components knob
      # (default follows show-details, which would reduce every health
      # response to a bare {"status":"UP"} and make the groups
      # indistinguishable). Component details (db vendor, disk paths)
      # remain hidden — only statuses are disclosed.
      show-components: always
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,uploadStorage
  info:
    # Exposes info.* application properties on /actuator/info (the env info
    # contributor is opt-in since Spring Boot 3.2 — it defaults to off).
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        # health + info are public (permitAll in SecurityConfig) so the
        # compose stack / a load balancer has a liveness probe without
        # credentials; the liveness/readiness health groups (#128) are
        # public on the same terms. Metrics and prometheus are exposed
        # for operators but stay behind auth (same SecurityConfig rule).
        # Nothing else is registered for the web; /actuator/** matches
        # are authenticated regardless.
        include: health,info,metrics,prometheus

info:
  app:
    name: campus-secondhand-marketplace
    # Honest scope: this is a portfolio/reconstruction project, not a
    # production system (see README scope notes).
    description: Campus second-hand marketplace backend (portfolio/reconstruction project)

---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: jdbc:mysql://mysql:3306/marketdb?createDatabaseIfNotExist=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: market
    password: market
