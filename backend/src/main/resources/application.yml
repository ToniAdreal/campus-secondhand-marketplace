spring:
  datasource:
    # Local dev default: in-memory H2 (MySQL compatibility mode), migrated by Flyway.
    # Real MySQL path: docker compose up (uses the `mysql` profile below).
    url: jdbc:h2:mem:marketdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: true
    # `{vendor}` is replaced by Spring Boot with the JDBC database product
    # id (mysql / h2). Vendor-specific migrations live under db/vendor/<id>/
    # as a SIBLING of db/migration/ — never nested inside it, because Flyway
    # scans locations recursively and would otherwise apply them on every
    # database. A missing vendor directory is skipped with a warning.
    locations: classpath:db/migration,classpath:db/vendor/{vendor}
  servlet:
    multipart:
      # Backstop for upload size; the primary check is in ImageStorageService
      # (app.uploads.max-size), which throws InvalidImageException → 400.
      max-file-size: 5MB
      max-request-size: 5MB
  data:
    web:
      pageable:
        # Cap requested page sizes on every Pageable-backed list endpoint
        # (backlog #75): GET /api/items, /api/orders and /api/seller/orders
        # all bind ?page=&size= through Spring Data's pageable resolver, so
        # ?size=10000 now clamps to this value instead of running an
        # unbounded row scan. @PageableDefault only sets the default — it
        # never capped the maximum. The message thread (#41) is unaffected:
        # it parses size itself (plain @RequestParam) and enforces its own
        # cap of 50 in MessageService.
        max-page-size: 100
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.format_sql: true

app:
  cors:
    # Explicit CORS allowlist (SecurityConfig, backlog #63). Before #63 there
    # was no CORS configuration at all. Defaults: Vite dev (5173) + the
    # docker-compose nginx origin (http://localhost — same origin as the
    # proxied API in practice). Production must override with the real SPA
    # origin, e.g. app.cors.allowed-origins=https://app.example.com.
    # allowed-origins: http://localhost:5173,http://localhost
  security:
    headers:
      # Security response headers (SecurityConfig, backlog #64). Every
      # response carries X-Content-Type-Options: nosniff, X-Frame-Options:
      # DENY and Referrer-Policy: no-referrer. HSTS
      # (Strict-Transport-Security) is opt-in: leave OFF for local
      # plain-HTTP dev, turn ON (app.security.headers.hsts-enabled=true)
      # on any HTTPS-served deployment. Honest scope: headers only, no CSP
      # yet (a strict CSP for the SPA is a declared follow-up).
      # hsts-enabled: false
  uploads:
    # Local directory for listing photos (served publicly under /uploads/**).
    # Override with the APP_UPLOADS_DIR environment variable in production.
    dir: ${APP_UPLOADS_DIR:./uploads}
    max-size: 5MB
  auth:
    login-lockout:
      # Per-account login lockout (AuthService, backlog #60): the per-IP token
      # bucket stops single-source hammering, but not a distributed slow
      # brute-force against one account. After max-attempts consecutive
      # failures the account locks for lock-duration and POST /api/auth/login
      # answers 423 with a Retry-After header; a successful login resets the
      # counter. Applies to existing accounts only — unknown identifiers keep
      # getting the identical 401 (no enumeration oracle).
      max-attempts: 5
      lock-duration: 15m
  cleanup:
    # Nightly purge of stale auth/order bookkeeping rows
    # (DataRetentionService, @Scheduled 03:00 server-local). Values in days.
    # refresh-token-retention: revoked-or-expired refresh_token rows kept
    #   after creation (audit + rotation-chain visibility), default 30.
    # idempotency-retention: terminal (COMPLETED/FAILED) idempotency_key rows
    #   kept after their last state transition, default 90. IN_PROGRESS rows
    #   are never purged.
    refresh-token-retention: 30
    idempotency-retention: 90
  orders:
    # Pending-order expiry (PendingOrderExpiryService, @Scheduled every 5
    # minutes server-local). A buyer who creates an order and never pays
    # strands the listing in RESERVED until they cancel manually (#33);
    # PENDING orders older than this TTL are cancelled automatically and the
    # listing flips back to AVAILABLE. Default 30 minutes; expiry granularity
    # is the 5-minute cadence, so a stale order holds its listing at most
    # TTL + one cadence.
    pending-ttl: 30m
  jwt:
    # Base64 HS256 key (256 bits). Dev-only placeholder for local H2 runs.
    # On the `mysql` profile (the docker-compose path) the app REFUSES to boot
    # with this placeholder — JwtSecretStartupCheck fails fast unless the
    # APP_JWT_SECRET environment variable is set. Access 15 min / refresh 7 days.
    secret: ${APP_JWT_SECRET:74xcpYqCpoJStMnkqprFiMYwsQIZD/zPa3LgyU83nbE=}
    access-ttl: 15m
    refresh-ttl: 7d
    # How long a just-rotated refresh token is still accepted once more
    # (concurrent-tab grace, backlog #39). Replays after the window kill
    # the token family (theft detection).
    refresh-grace-window: 60s
    # Absolute lifetime of a refresh-token family (backlog #61), measured
    # from the original login. A refresh past this point returns 401 and
    # revokes the family — even when the presented token is unexpired —
    # forcing a fresh login; rotation alone can no longer keep a session
    # alive forever.
    refresh-max-age: 30d

logging:
  pattern:
    # %X{requestId} is set by RequestIdFilter (backlog #44) — every request's
    # log lines carry its X-Request-ID; empty when nothing is in the MDC.
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{requestId}] %logger{36} - %msg%n"

management:
  info:
    # Exposes info.* application properties on /actuator/info (the env info
    # contributor is opt-in since Spring Boot 3.2 — it defaults to off).
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        # health + info are public (permitAll in SecurityConfig) so the
        # compose stack / a load balancer has a liveness probe without
        # credentials; metrics and prometheus are exposed for operators but
        # stay behind auth (same SecurityConfig rule). Nothing else is
        # registered for the web; /actuator/** matches are authenticated
        # regardless.
        include: health,info,metrics,prometheus

info:
  app:
    name: campus-secondhand-marketplace
    # Honest scope: this is a portfolio/reconstruction project, not a
    # production system (see README scope notes).
    description: Campus second-hand marketplace backend (portfolio/reconstruction project)

---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: jdbc:mysql://mysql:3306/marketdb?createDatabaseIfNotExist=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: market
    password: market
