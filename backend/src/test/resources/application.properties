# Shared test profile: the auth rate limiter is disabled here because the
# suite hammers POST /api/auth/login and /register from a single test IP
# (MockMvc's default remote address), which would trip the production
# throttle (default 5/min) and make unrelated tests flaky. The dedicated
# AuthRateLimitTest re-enables it explicitly via @TestPropertySource.
app.auth.rate-limit.enabled=false
# The email-verification gate (backlog #138) is disabled here for the same
# reason in spirit: the suite registers hundreds of throwaway accounts and
# immediately logs in with them, and there is no mailbox in a test to
# confirm from — with the gate on, every one of those logins would 403.
# The dedicated EmailVerificationTest / EmailVerificationRateLimitTest
# re-enable it explicitly via @TestPropertySource. Production defaults
# stay ON (see EmailVerificationProperties and application.yml).
app.auth.email-verification.enabled=false
