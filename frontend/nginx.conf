# Campus Marketplace — nginx serving the built SPA + /api reverse proxy.
#
# Security response headers (backlog #363): the same four headers the
# backend's SecurityConfig sends, mirrored here so the SPA's HTML
# documents carry them too (the backend flag covers the API +
# /uploads/** only). They are declared in BOTH locations on purpose:
# nginx inherits add_header from the server block only while a location
# defines none of its own, so per-location declarations keep the policy
# explicit and immune to a future add_header in either location.
# HSTS stays OFF here — local HTTP dev; it is opt-in on the backend
# (app.security.headers.hsts-enabled) for HTTPS deployments only.
#
# The CSP is the backend's opt-in strict policy
# (SecurityConfig.CONTENT_SECURITY_POLICY: default-src 'self'; img-src
# 'self' data:; script-src 'self'; connect-src 'self' ws:) with the
# sha256 hash of the pre-paint theme script in frontend/index.html
# (backlog #227) added to script-src, so the first frame still applies
# the stored theme. The hash is over the script element's exact text
# content (verified byte-identical in dist/index.html):
#   sha256-l5OtRYXwNuxvsOSGfv4BuoakHOTOJh8o8oaN3x1MbDU=
# If index.html's script ever changes, this hash must be recomputed
# (the CI smoke job cross-checks it against the checked-out source) or
# the script is blocked and the theme degrades to the main.tsx
# re-apply — a brief flash, never a broken theme.
#
# Honest note: /api/ responses carry X-Content-Type-Options,
# X-Frame-Options and Referrer-Policy twice (once from nginx here, once
# from the backend's own chain) with identical values — benign
# duplication that keeps the proxy the single place where the
# SPA-facing policy is declared. The backend's CSP is opt-in and off by
# default, so on /api/ the CSP here is the only one sent unless an
# operator enables the backend flag (which would then send an identical
# second CSP — both policies enforced, same policy).
server {
  listen 80;

  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; script-src 'self' 'sha256-l5OtRYXwNuxvsOSGfv4BuoakHOTOJh8o8oaN3x1MbDU='; connect-src 'self' ws:" always;
  }

  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; script-src 'self' 'sha256-l5OtRYXwNuxvsOSGfv4BuoakHOTOJh8o8oaN3x1MbDU='; connect-src 'self' ws:" always;
  }
}
